plugins {
    id 'com.android.application'
}

android {
    namespace 'com.powerkraft.cnc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dncserver.ver5'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
